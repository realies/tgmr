version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
  # Keeps the SHA-pinned actions in docker-build.yml current automatically
  # (Dependabot bumps the pinned SHA + the `# vX` comment), so pinning doesn't
  # become a manual-maintenance burden.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # One PR for all action bumps. Ungrouped, unmerged minor bumps hit the
    # 5-open-PR limit and silently froze action updates (Jul–Nov 2026).
    groups:
      actions:
        patterns: ["*"]
